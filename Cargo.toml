[workspace]
resolver = "2"
members = ["common", "core", "server", "desktop", "web", "client"]
default-members = ["server", "desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 4

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
