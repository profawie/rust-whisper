[package]
name = "whisper-web"
version.workspace = true
edition.workspace = true

[dependencies]
common = { path = "../common" }
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement",
  "HtmlOptionElement", "HtmlCollection", "DomTokenList",
  "Storage", "MediaQueryList", "Navigator", "Clipboard",
  "EventSource", "MessageEvent", "Event", "EventTarget", "ProgressEvent", "DragEvent", "DataTransfer",
  "File", "FileList", "Blob", "XmlHttpRequest", "XmlHttpRequestUpload", "KeyboardEvent", "MouseEvent",
  "Request", "RequestInit", "Response", "Headers", "Location"
] }
